<!-- WebContent/index.xhtml -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
	<title>LanceNexis</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="resources/css/index.css" />
</h:head>

<h:body>

	<div class="app">

		<!-- HEADER -->
		<div class="header">
			<div class="header-icon">
				<!-- ÍCONE LANCENEXIS: Martelo de Leilão + Conexões/Nós -->
				<svg viewBox="0 0 64 64" fill="none"
					xmlns="http://www.w3.org/2000/svg"> <!-- Círculo base --> <circle
					cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2"
					opacity="0.3" /> <!-- Nós de conexão (Nexis) --> <circle cx="20"
					cy="24" r="4" fill="currentColor" /> <circle cx="44" cy="24" r="4"
					fill="currentColor" /> <circle cx="32" cy="44" r="4"
					fill="currentColor" /> <!-- Linhas de conexão --> <line x1="20"
					y1="24" x2="44" y2="24" stroke="currentColor" stroke-width="2.5"
					stroke-linecap="round" /> <line x1="20" y1="24" x2="32" y2="44"
					stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
				<line x1="44" y1="24" x2="32" y2="44" stroke="currentColor"
					stroke-width="2.5" stroke-linecap="round" /> <!-- Martelo/Lance no centro -->
				<g transform="translate(26, 20) rotate(-45)"> <rect x="5" y="0"
					width="4" height="14" rx="1" fill="currentColor" /> <rect x="0"
					y="0" width="14" height="5" rx="1" fill="currentColor" /> </g> <!-- Estrela/Lance brilhante -->
				<path
					d="M32 8 L34 14 L40 14 L35 18 L37 24 L32 20 L27 24 L29 18 L24 14 L30 14 Z"
					fill="currentColor" opacity="0.9" /> </svg>
			</div>
			<h1>
				Lance<span>Nexis</span>
			</h1>
			<p>Sistema de Cadastro</p>
		</div>

		<!-- FORM -->
		<div class="form-card">
			<div class="card-title">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2"> <path
					d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" /> <path
					d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /> </svg>
				<span>Novo Cadastro</span>
			</div>

			<h:form>

				<div class="form-grid">

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <rect x="3" y="3"
								width="18" height="18" rx="2" /> <path d="M3 9h18" /> <path
								d="M9 21V9" /> </svg> ID
						</label>
						<h:inputText value="#{pessoaBean.pessoa.id}" readonly="true"
							styleClass="readonly" />
					</div>

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <path
								d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /> <circle cx="12"
								cy="7" r="4" /> </svg> Nome
						</label>
						<h:inputText value="#{pessoaBean.pessoa.nome}"
							placeholder="Digite o nome" />
					</div>

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <path
								d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /> <circle cx="9"
								cy="7" r="4" /> <path d="M23 21v-2a4 4 0 00-3-3.87" /> <path
								d="M16 3.13a4 4 0 010 7.75" /> </svg> Sobrenome
						</label>
						<h:inputText value="#{pessoaBean.pessoa.sobrenome}"
							placeholder="Digite o sobrenome" />
					</div>

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <circle cx="12"
								cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /> </svg>
							Idade
						</label>
						<h:inputText value="#{pessoaBean.pessoa.idade}"
							placeholder="Ex: 25" />
					</div>

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <circle cx="12"
								cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /> </svg> Sexo
						</label>
						<h:selectOneMenu id="campoSexo" styleClass="select-sexo"
							value="#{pessoaBean.pessoa.sexo}">
							<f:selectItem itemLabel="Masculino" itemValue="Masculino" />
							<f:selectItem itemLabel="Feminino" itemValue="Feminino" />
						</h:selectOneMenu>
					</div>

					<div class="field">
						<label> <svg viewBox="0 0 24 24" fill="none"
								stroke="currentColor" stroke-width="2"> <circle cx="12"
								cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /> </svg>
							Setor
						</label>

						<h:selectManyMenu id="campoSetor" styleClass="select-setor"
							size="4" value="#{pessoaBean.pessoa.setor}">

							<f:selectItem itemLabel="Gerente" itemValue="GERENTE" />
							<f:selectItem itemLabel="Diretor" itemValue="DIRETOR" />
							<f:selectItem itemLabel="Administrativo"
								itemValue="ADMINISTRATIVO" />
							<f:selectItem itemLabel="RH" itemValue="RH" />

						</h:selectManyMenu>
					</div>

<div class="status-group">

    <label class="status-option ativo">
        <h:selectBooleanCheckbox value="#{pessoaBean.pessoa.ativo}">
            <f:ajax listener="#{pessoaBean.onAtivoChange}" render="@form"/>
        </h:selectBooleanCheckbox>

        <span>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="9 12 12 15 16 10"/>
            </svg>
            Ativo
        </span>
    </label>

    <label class="status-option inativo">
        <h:selectBooleanCheckbox value="#{pessoaBean.pessoa.inativo}">
            <f:ajax listener="#{pessoaBean.onInativoChange}" render="@form"/>
        </h:selectBooleanCheckbox>

        <span>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="8" y1="8" x2="16" y2="16"/>
                <line x1="16" y1="8" x2="8" y2="16"/>
            </svg>
            Inativo
        </span>
    </label>

</div>



				</div>

				<div class="actions">

					<h:commandButton value="Novo" action="#{pessoaBean.novo}"
						styleClass="btn btn-light" />

					<h:commandButton value="Salvar" action="#{pessoaBean.salvar}"
						styleClass="btn btn-primary" />

					<h:commandButton value="Remover" action="#{pessoaBean.remove}"
						styleClass="btn btn-danger" />



				</div>
			</h:form>
		</div>

		<!-- TABLE -->
		<div class="table-card">

			<div class="card-title">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2"> <line x1="8" y1="6" x2="21" y2="6" /> <line
					x1="8" y1="12" x2="21" y2="12" /> <line x1="8" y1="18" x2="21"
					y2="18" /> <line x1="3" y1="6" x2="3.01" y2="6" /> <line x1="3"
					y1="12" x2="3.01" y2="12" /> <line x1="3" y1="18" x2="3.01"
					y2="18" /> </svg>
				<span>Lista de Participantes</span>
				<div class="badge-count">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="2"> <path
						d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /> <circle cx="9"
						cy="7" r="4" /> </svg>
					#{pessoaBean.pessoas.size()} registros
				</div>
			</div>

			<h:form>

				<div class="table-wrapper">

					<h:dataTable value="#{pessoaBean.pessoas}" var="pessoa"
						styleClass="table">

						<h:column>
							<f:facet name="header">
								<span class="th-content"> <svg viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2"> <rect
										x="3" y="3" width="18" height="18" rx="2" /> <path
										d="M3 9h18" /> <path d="M9 21V9" /> </svg> ID
								</span>
							</f:facet>
							<span class="td-id">#{pessoa.id}</span>
						</h:column>

						<h:column>
							<f:facet name="header">
								<span class="th-content"> <svg viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2"> <path
										d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /> <circle
										cx="12" cy="7" r="4" /> </svg> Nome
								</span>
							</f:facet>
                        #{pessoa.nome}
                    </h:column>

						<h:column>
							<f:facet name="header">
								<span class="th-content"> <svg viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2"> <path
										d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /> <circle cx="9"
										cy="7" r="4" /> <path d="M23 21v-2a4 4 0 00-3-3.87" /> <path
										d="M16 3.13a4 4 0 010 7.75" /> </svg> Sobrenome
								</span>
							</f:facet>
                        #{pessoa.sobrenome}
                    </h:column>

						<h:column>
							<f:facet name="header">
								<span class="th-content"> <svg viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2"> <circle
										cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16 14" />
									</svg> Idade
								</span>
							</f:facet>
							<span class="td-idade">#{pessoa.idade} <small>anos</small></span>


						</h:column>

						<h:column>
							<f:facet name="header">
								<span class="th-setor"> <!-- Ícone Setor --> <svg
										viewBox="0 0 24 24" fill="none" stroke="currentColor"
										stroke-width="2"> <rect x="3" y="3" width="7" height="7" />
									<rect x="14" y="3" width="7" height="7" /> <rect x="14" y="14"
										width="7" height="7" /> <rect x="3" y="14" width="7"
										height="7" /> </svg> Setor
								</span>
							</f:facet>

							<span class="td-setor"> #{pessoa.setorFormatado} </span>
						</h:column>

						<h:column>
							<f:facet name="header">
								<span class="th-status"> <svg viewBox="0 0 24 24"
										fill="none" stroke="currentColor" stroke-width="2"> <circle
										cx="12" cy="12" r="10" /> <path d="M9 12l2 2 4-4" /> </svg> Status
								</span>
							</f:facet>

							<span class="td-status"> <h:panelGroup
									rendered="#{pessoa.ativo}">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
										stroke-width="2"> <circle cx="12" cy="12" r="10" /> <path
										d="M9 12l2 2 4-4" /> </svg>
            Ativo
        </h:panelGroup> <h:panelGroup rendered="#{!pessoa.ativo}">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
										stroke-width="2"> <circle cx="12" cy="12" r="10" /> <line
										x1="8" y1="8" x2="16" y2="16" /> <line x1="16" y1="8" x2="8"
										y2="16" /> </svg>
            Inativo
        </h:panelGroup>
							</span>
						</h:column>

						<h:column>
							<h:commandLink styleClass="btn-action btn-edit" value="editar">
								<f:setPropertyActionListener target="#{pessoaBean.pessoa}"
									value="#{pessoa}" />
								<!-- Ícone de Editar -->
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
									stroke-width="2.5" stroke-linecap="round"
									stroke-linejoin="round"> <path
									d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" /> <path
									d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" /> </svg>

							</h:commandLink>

							<h:commandLink styleClass="btn-action btn-delete" value="Excluir"
								action="#{pessoaBean.remove}">

								<f:setPropertyActionListener target="#{pessoaBean.pessoa}"
									value="#{pessoa}" />

								<!-- Ícone de Lixeira -->
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
									stroke-width="2.5" stroke-linecap="round"
									stroke-linejoin="round"> <path d="M3 6h18" /> <path
									d="M8 6V4h8v2" /> <path d="M19 6l-1 14H6L5 6" /> <path
									d="M10 11v6" /> <path d="M14 11v6" /> </svg>

							</h:commandLink>
						</h:column>

					</h:dataTable>

				</div>

			</h:form>
		</div>

		<!-- FOOTER -->
		<div class="footer">
			<p>LanceNexis Sistema de Cadastro</p>
		</div>

	</div>

</h:body>
</html>
