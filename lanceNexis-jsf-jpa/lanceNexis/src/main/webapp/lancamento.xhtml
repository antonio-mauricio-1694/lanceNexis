<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
    <title>LanceNexis - Novo Lançamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <h:outputStylesheet library="css" name="lancamneto.css" />
</h:head>

<h:body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <p>Lançamento de Notas Fiscais</p>

        <h:form id="menuForm" styleClass="menu-nav">

            <h:commandLink action="index.xhtml">
                <i class="bi bi-person-circle"></i> Cadastro
            </h:commandLink>

            <div class="v-divider"></div>

            <h:commandLink action="login.xhtml">
                <i class="bi bi-arrow-left-right"></i> Trocar Usuário
            </h:commandLink>

        </h:form>
    </div>

    <!-- FORM -->
    <div class="container">

        <h:form id="formLancamento">

            <div class="title-section">
                <i class="bi bi-file-earmark-text"></i>
                <h2>Novo Lançamento</h2>
            </div>

            <h:messages />

            <div class="form-group">
                <label>Numero da Nota Fiscal *</label>
                <h:inputText value="#{lancamentoBean.lancamento.numeroNotaFiscal}"
                             required="true"
                             styleClass="input"
                             p:placeholder="000.000.000" />
            </div>

            <div class="form-group">
                <label>Empresa Origem *</label>
                <h:inputText value="#{lancamentoBean.lancamento.empresaOrigem}"
                             required="true"
                             styleClass="input"
                             p:placeholder="Empresa emissora" />
            </div>

            <div class="form-group">
                <label>Empresa Destino *</label>
                <h:inputText value="#{lancamentoBean.lancamento.empresaDestino}"
                             required="true"
                             styleClass="input"
                             p:placeholder="Empresa destinatária" />
            </div>

            <!-- ACTIONS -->
            <div class="actions">

                <h:commandButton value="Novo"
                                 action="#{lancamentoBean.novo}"
                                 styleClass="btn btn-light" />

                <h:commandButton value="Salvar"
                                 action="#{lancamentoBean.salvar}"
                                 styleClass="btn btn-primary" />

            </div>

        </h:form>

    </div>

</div>

<!-- TABELA -->
<h:form id="formTabela">

    <div class="table-container">

        <div class="table-title">
            📄 Lançamentos
        </div>

        <h:dataTable value="#{lancamentoBean.lancamentos}" var="l"
                     styleClass="table table-striped table-hover">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{l.id}
            </h:column>

            <h:column>
                <f:facet name="header">Nota Fiscal</f:facet>
                #{l.numeroNotaFiscal}
            </h:column>

            <h:column>
                <f:facet name="header">Empresa Origem</f:facet>
                #{l.empresaOrigem}
            </h:column>

            <h:column>
                <f:facet name="header">Empresa Destino</f:facet>
                #{l.empresaDestino}
            </h:column>

            <h:column>
                <f:facet name="header">Usuário</f:facet>
                #{l.usuario.nome}
            </h:column>

            <h:column>
                <f:facet name="header">Ações</f:facet>

                <!-- EDITAR -->
                <h:commandButton value="Editar"
                 action="#{lancamentoBean.editar(l)}"
                 styleClass="btn btn-edit" />

                <h:commandButton value="Excluir"
                 action="#{lancamentoBean.remover(l)}"
                 styleClass="btn-danger" />

            </h:column>

        </h:dataTable>

    </div>

</h:form>

</h:body>
</html>
