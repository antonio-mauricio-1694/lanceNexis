<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html">

<h:head>
    <title>Login - LanceNexis</title>
    <link rel="stylesheet" href="resources/css/login.css"/>
</h:head>

<h:body>

<div class="bg"></div>

<div class="container">

    <!-- HEADER IMPACTANTE -->
    <div class="header">

        <div class="logo-box">
            <div class="glow"></div>

            <svg viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="2" opacity="0.2"/>
                <circle cx="20" cy="24" r="4" fill="currentColor"/>
                <circle cx="44" cy="24" r="4" fill="currentColor"/>
                <circle cx="32" cy="44" r="4" fill="currentColor"/>

                <line x1="20" y1="24" x2="44" y2="24" stroke="currentColor" stroke-width="2.5"/>
                <line x1="20" y1="24" x2="32" y2="44" stroke="currentColor" stroke-width="2.5"/>
                <line x1="44" y1="24" x2="32" y2="44" stroke="currentColor" stroke-width="2.5"/>

                <g transform="translate(26, 20) rotate(-45)">
                    <rect x="5" y="0" width="4" height="14" rx="1" fill="currentColor"/>
                    <rect x="0" y="0" width="14" height="5" rx="1" fill="currentColor"/>
                </g>

                <path d="M32 8 L34 14 L40 14 L35 18 L37 24 L32 20 L27 24 L29 18 L24 14 L30 14 Z"
                      fill="currentColor"/>
            </svg>

        </div>

        <h1>Lance<span>Nexis</span></h1>
        <p>Acesse sua conta</p>

    </div>

    <!-- CARD LOGIN -->
    <div class="card">

        <h:form id="formLogin">

            <div class="field">
                <label>Usuário</label>
                <h:inputText value="#{pessoaBean.login}" styleClass="input"/>
            </div>

            <div class="field">
                <label>Senha</label>
                <h:inputSecret value="#{pessoaBean.senha}" styleClass="input"/>
            </div>

            <h:commandButton value="Entrar"
                             action="#{pessoaBean.logar}"
                             styleClass="btn"/>

        </h:form>

    </div>

</div>

</h:body>
</html>
